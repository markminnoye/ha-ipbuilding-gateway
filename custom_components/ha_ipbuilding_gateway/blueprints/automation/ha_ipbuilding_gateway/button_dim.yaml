blueprint:
  name: IPBuilding wandknop — dimmen
  description: >
    **✓ Aanbevolen voor IP0300PoE dimmers.** Kort indrukken = toggle ·
    vasthouden = native hold-to-dim ramp (gateway + IP0300PoE regelen
    de richting zelf) · loslaten = ramp stoppen. **Geen helper nodig,
    geen blueprint-state** — de dimmer zelf houdt de richting bij.

    **Blueprint-versie: 9.** Vereist gateway add-on vanaf
    `feature/dimmer-downstream-td` (volgende release: `1.1.0`).

    Alleen als je een dimmer zonder native hold-to-dim aanstuurt of
    zelf de dimsnelheid/-stap in HA wilt regelen, gebruik dan
    `button_dim_stepwise` (⚠️ experimenteel, helper vereist). Voor
    gewone aan/uit/scene: `button_standard`.
  domain: automation
  source_url: https://github.com/markminnoye/ha-ipbuilding-gateway/blob/main/custom_components/ha_ipbuilding_gateway/blueprints/automation/ha_ipbuilding_gateway/button_dim.yaml

  input:
    button_entity:
      name: Knop
      description: >
        De IPBuilding event-entity van de fysieke wandknop
        (bv. `event.2f8185190000df`). De entity moet ingeschakeld
        zijn in Instellingen → Apparaten & entiteiten.
      selector:
        entity:
          filter:
            - domain: event
              integration: ha_ipbuilding_gateway

    target_light:
      name: Lamp
      description: De lamp (of lampengroep) om te dimmen.
      selector:
        entity:
          domain: light
          multiple: false

    transition:
      name: Overgangstijd (seconden)
      description: >
        Zachte overgangstijd bij kort indrukken (standaard 6,0 s ≈ fade 30).
        Zet op 0 voor directe native toggle (module-geheugen zonder fade).
      default: 6.0
      selector:
        number:
          min: 0.0
          max: 51.0
          step: 0.2
          unit_of_measurement: s
          mode: box

variables:
  target_light: !input target_light
  transition_s: !input transition

mode: restart

trigger:
  - platform: state
    entity_id: !input button_entity
    attribute: event_type
    to: "single_press"
    not_from:
      - unavailable
      - unknown
    id: single_press
  - platform: state
    entity_id: !input button_entity
    attribute: event_type
    to: "long_press"
    not_from:
      - unavailable
      - unknown
    id: hold
  - platform: state
    entity_id: !input button_entity
    # Only a release that ends a hold (long_press → release) fires here.
    # A short-tap release (single_press → release) must NOT fire the stop
    # path — with mode:restart it would cancel the in-flight single_press
    # toggle before it runs.
    attribute: event_type
    from: "long_press"
    to: "release"
    id: release

action:
  - choose:
      # Short press → soft turn_on/turn_off when transition > 0 (routes via
      # S/C + fade), or native light.toggle (T<ch>991000) when transition == 0.
      - conditions:
          - condition: trigger
            id: single_press
        sequence:
          - if:
              - condition: template
                value_template: "{{ (transition_s | float(0)) > 0 }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ is_state(target_light, 'on') }}"
                then:
                  - action: light.turn_off
                    target:
                      entity_id: !input target_light
                    data:
                      transition: "{{ transition_s | float }}"
                else:
                  - action: light.turn_on
                    target:
                      entity_id: !input target_light
                    data:
                      transition: "{{ transition_s | float }}"
            else:
              - action: light.toggle
                target:
                  entity_id: !input target_light

      # Hold → start the native ramp on the IP0300PoE. The module ramps
      # and auto-reverses direction on each successive hold; no helper,
      # no repeat, no endpoint detection in HA. The dim_speed is the
      # module's internal setting (matches native IPBox behaviour).
      - conditions:
          - condition: trigger
            id: hold
        sequence:
          - action: ha_ipbuilding_gateway.dim_start
            target:
              entity_id: !input target_light

      # Release (after a real long press) → stop the ramp. The dimmer
      # replies with the level reached when the stop landed and the
      # companion light follows via the existing state_changed wire.
      - conditions:
          - condition: trigger
            id: release
        sequence:
          - action: ha_ipbuilding_gateway.dim_stop
            target:
              entity_id: !input target_light

# ipbuilding_blueprint_version: 9
